spring:
  profiles:
    active: dev
  application:
    name: erp-fleet-service-test
  # El perfil de test NO define datasource: la configuracion de la base de
  # datos la inyecta AbstractPostgresIntegrationTest, que arranca una
  # instancia real de PostgreSQL en proceso.
  #
  # Antes se usaba H2 con ddl-auto: create-drop y Flyway desactivado, con lo
  # que las migraciones nunca se ejecutaban, la politica de Row-Level Security
  # no se aplicaba jamas y una migracion alterada no se detectaba nunca.
  jpa:
    show-sql: false
  flyway:
    enabled: true

erp:
  auth:
    jwks-url: http://127.0.0.1:1/.well-known/jwks.json
  integration-hub:
    url: http://127.0.0.1:1
    key: test_fleet_internal_key
    service-name: erp-fleet-service
  cache:
    ruc-ttl: 30d
    placa-ttl: 7d
  revalidacion:
    max-por-taller: 10
    # El barrido programado no se dispara durante los tests: el test del
    # barrido lo invoca de forma explicita.
    intervalo: 1h

resilience4j:
  circuitbreaker:
    instances:
      hubValidacion:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

logging:
  level:
    root: WARN
    com.erp.fleet: INFO
