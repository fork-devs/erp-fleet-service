server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

spring:
  application:
    name: erp-fleet-service

  datasource:
    # El rol de ejecucion NO es propietario de las tablas: el propietario
    # elude su propia politica de Row-Level Security, de modo que con el
    # propietario la politica no aislaria nada.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/erp_fleet_db}
    username: ${SPRING_DATASOURCE_USERNAME:erp_fleet_app}
    # Sin valor por defecto: la contraseña llega por variable de entorno o por
    # el almacen de secretos. Un valor por defecto en un fichero versionado es
    # un secreto publicado.
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: FleetHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # El servicio es dueno de su esquema. Con baseline-on-migrate activado, una
    # base ya existente se marcaria como linea base y las migraciones NO se
    # aplicarian: la politica de RLS no llegaria a crearse.
    baseline-on-migrate: false
    # Las migraciones se ejecutan con el rol de propietario, que es distinto
    # del rol de ejecucion de la aplicacion.
    user: ${SPRING_FLYWAY_USER:erp_fleet_owner}
    password: ${SPRING_FLYWAY_PASSWORD:}
    placeholders:
      # Contrasena del rol de EJECUCION de la aplicacion, que crea la
      # migracion V3. Sin privilegios de propietario y sin BYPASSRLS.
      appRolePassword: ${ERP_APP_DB_PASSWORD:}
      # Contrasena del rol de PLATAFORMA, usado solo por el barrido de
      # revalidacion, que recorre los talleres con registros pendientes.
      platformRolePassword: ${ERP_PLATFORM_DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

erp:
  auth:
    # El conjunto de claves del emisor se publica en /.well-known/jwks.json.
    # La URL debe usar un esquema cifrado; el arranque falla de forma
    # explicita si no, y la unica excepcion es el perfil de desarrollo local.
    jwks-url: ${JWKS_URL:https://auth.erp-automotriz.com/.well-known/jwks.json}
  integration-hub:
    # El hub es el unico punto de salida a SUNAT/PSE, RENIEC y consulta
    # vehicular. fleet lo llama por HTTPS, con su propia clave de servicio.
    url: ${INTEGRATION_HUB_URL:https://integration-hub.erp-automotriz.com}
    key: ${INTEGRATION_HUB_KEY:}
    service-name: ${INTEGRATION_HUB_SERVICE_NAME:erp-fleet-service}
  cors:
    # Lista explicita de origenes permitidos. No se admite el comodin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cache:
    # Vigencia de la cache de validaciones correctas.
    ruc-ttl: ${VALIDACION_CACHE_RUC_TTL:30d}
    placa-ttl: ${VALIDACION_CACHE_PLACA_TTL:7d}
  platform-role:
    # Rol con BYPASSRLS, usado EXCLUSIVAMENTE por el barrido de revalidacion,
    # que recorre los talleres con registros pendientes y todavia no conoce el
    # taller de cada uno. Su credencial vive separada de la de la aplicacion.
    user: ${ERP_PLATFORM_DB_USER:erp_fleet_platform}
    password: ${ERP_PLATFORM_DB_PASSWORD:}
  revalidacion:
    # Barrido de revalidacion: como maximo esta cantidad de registros por
    # taller y por ejecucion, para no agotar la cuota de validacion del hub,
    # que se comparte entre talleres.
    max-por-taller: ${REVALIDACION_MAX_POR_TALLER:10}
    intervalo: ${REVALIDACION_INTERVALO:60s}

resilience4j:
  circuitbreaker:
    instances:
      hubValidacion:
        # El circuito se abre tras estos fallos consecutivos y deja pasar una
        # sola prueba en estado medio abierto.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    # El documento se publica tras un perfil: en un entorno de produccion no
    # hace falta, y publicarlo es informar a cualquiera de la superficie de la
    # API.
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.erp.fleet: DEBUG
