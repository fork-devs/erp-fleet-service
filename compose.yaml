# =============================================================================
# ERP FLEET SERVICE - ENTORNO LOCAL
# =============================================================================
# La base se crea con el rol PROPIETARIO del esquema, que es el unico que
# ejecuta las migraciones. El rol de EJECUCION de la aplicacion lo crea la
# migracion V3, con los permisos que necesita y sin privilegios de propietario:
# el propietario de una tabla elude su propia politica de Row-Level Security.
#
# Ningun secreto tiene valor por defecto: las contrasenas llegan por variable
# de entorno. Si faltan, el compose falla al arrancar en lugar de publicar una
# contrasena conocida.
# =============================================================================

services:
  fleet-postgres:
    image: 'postgres:16-alpine'
    container_name: erp-fleet-postgres
    environment:
      - POSTGRES_DB=erp_fleet_db
      - POSTGRES_USER=erp_fleet_owner
      - POSTGRES_PASSWORD=${SPRING_FLYWAY_PASSWORD:?defina SPRING_FLYWAY_PASSWORD con la contrasena del rol propietario}
    ports:
      - '5435:5432'
    volumes:
      - postgres_fleet_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_fleet_owner -d erp_fleet_db']
      interval: 5s
      timeout: 5s
      retries: 10

  fleet-redis:
    image: 'redis:7-alpine'
    container_name: erp-fleet-redis
    # La cache de validaciones es de fleet y no del hub porque la del hub es
    # LOCAL a cada instancia. Con varias replicas, cada una consultaria al
    # proveedor externo por su cuenta.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD con la contrasena de la cache}']
    ports:
      - '6383:6379'
    volumes:
      - redis_fleet_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD con la contrasena de la cache}

volumes:
  postgres_fleet_data:
  redis_fleet_data:
